<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gestão financeira de cirurgias e OPME, do pedido ao recebimento." />
    <title>AXIS</title>
    <style>
      /* Evita flash de branco puro: a cor do app vale antes do CSS/JS carregar. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #fafaf9;
      }
      #app-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: -apple-system, "SF Pro Display", "SF Pro Text", Inter, sans-serif;
        background: #fafaf9;
      }
      #app-boot .logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #0071e3;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
      }
      #app-boot .wordmark {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #1d1d1f;
      }
      #app-boot .spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid #e5e5ea;
        border-top-color: #0071e3;
        animation: axis-spin 0.8s linear infinite;
      }
      @keyframes axis-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loader estático pré-React; substituído automaticamente quando o React monta. -->
      <div id="app-boot" role="status" aria-label="Carregando AXIS">
        <div class="logo">A</div>
        <div class="wordmark">AXIS</div>
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
